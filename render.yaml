# Render Blueprint — ChameleonVault
# Deploy: push to GitHub, then in Render → "New +" → "Blueprint" → pick this repo.
#
# This provisions the Next.js war-room dashboard as a free web service. The AI
# agent pushes its status to the dashboard's /api/status route, so the two never
# need a shared filesystem.
#
# The agent is included below as an optional background worker (Render workers
# require a paid plan). For a zero-cost demo, leave it commented out and instead
# run the agent on your laptop with STATUS_PUSH_URL pointing at the deployed URL.

services:
  # ---------------------------------------------------------------------------
  # Frontend — Next.js dashboard (FREE web service)
  # ---------------------------------------------------------------------------
  - type: web
    name: chameleon-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      # Whale Attack route (server-side). Set these in the Render dashboard.
      - key: MANTLE_RPC_URL
        value: https://rpc.sepolia.mantle.xyz
      - key: VAULT_ADDRESS
        sync: false
      - key: METH_ADDRESS
        sync: false
      - key: WHALE_PRIVATE_KEY
        sync: false
      # Shared secret so only your agent can push status updates.
      - key: AGENT_PUSH_SECRET
        sync: false

  # ---------------------------------------------------------------------------
  # AI Agent — Python worker (PAID: Render background workers are not free).
  # Uncomment to run the agent in the cloud; otherwise run it locally.
